[project]
name = "review-bot"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Frosty", email = "yavorpetrov86@gmail.com" }
]
requires-python = ">=3.14"
dependencies = [
    "google-genai>=3.2.0",
    "requests>=2.34.2",
]

[project.scripts]
review-bot = "review_bot.main:main"

[build-system]
requires = ["uv_build>=0.11.9,<0.12.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.2.0",
]
